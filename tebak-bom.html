<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tebak Bom</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', sans-serif;
  background: #0d0d0d;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #fff;
  padding: 24px 16px;
}

h1 {
  font-size: 2.2rem;
  font-weight: 900;
  letter-spacing: -1px;
  margin-bottom: 2px;
}

.subtitle {
  font-size: 0.82rem;
  color: #555;
  margin-bottom: 22px;
  letter-spacing: 0.5px;
}

/* DIFFICULTY */
.difficulty {
  display: flex;
  gap: 8px;
  margin-bottom: 22px;
}

.diff-btn {
  padding: 7px 20px;
  border-radius: 50px;
  border: 1.5px solid #2a2a2a;
  background: #111;
  color: #555;
  cursor: pointer;
  font-size: 0.8rem;
  font-weight: 600;
  transition: all 0.18s;
  letter-spacing: 0.3px;
}

.diff-btn.active {
  border-color: #fff;
  color: #fff;
  background: #1e1e1e;
}

.diff-btn:hover:not(.active) {
  border-color: #444;
  color: #aaa;
}

/* SCOREBOARD */
.scoreboard {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: #1a1a1a;
  border: 1px solid #1a1a1a;
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 24px;
  width: 100%;
  max-width: 420px;
}

.score-cell {
  background: #0d0d0d;
  padding: 14px 10px;
  text-align: center;
}

.score-cell:first-child { border-radius: 16px 0 0 0; }
.score-cell:nth-child(4) { border-radius: 0 16px 0 0; }
.score-cell:nth-child(5) { border-radius: 0 0 0 16px; }
.score-cell:last-child { border-radius: 0 0 16px 0; }

.score-label {
  font-size: 0.6rem;
  color: #444;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  margin-bottom: 6px;
}

.score-value {
  font-size: 1.5rem;
  font-weight: 800;
  line-height: 1;
}

.score-value.gold { color: #f0c040; }
.score-value.green { color: #4ade80; }
.score-value.red { color: #f87171; }
.score-value.white { color: #fff; }

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 110px);
  gap: 10px;
  margin-bottom: 24px;
}

.cell {
  width: 110px;
  height: 110px;
  background: #111;
  border: 1.5px solid #1f1f1f;
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 2.6rem;
  cursor: pointer;
  transition: background 0.13s, border-color 0.13s, transform 0.1s;
  user-select: none;
  position: relative;
}

.cell-num {
  position: absolute;
  top: 7px;
  left: 9px;
  font-size: 0.65rem;
  font-weight: 700;
  color: #333;
}

.cell:not(.revealed):hover {
  background: #1c1c1c;
  border-color: #3a3a3a;
  transform: scale(1.04);
}

.cell.revealed { cursor: default; }

.cell.fruit {
  background: #0f1f14;
  border-color: #2a5c38;
  animation: popIn 0.28s ease;
}

.cell.bomb {
  background: #1f0d0d;
  border-color: #7f2020;
  animation: shake 0.35s ease;
}

.cell.dimmed {
  opacity: 0.35;
  animation: none;
}

@keyframes popIn {
  0% { transform: scale(0.65); opacity: 0.2; }
  70% { transform: scale(1.07); }
  100% { transform: scale(1); opacity: 1; }
}

@keyframes shake {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(5px); }
}

/* BUTTON */
.btn {
  padding: 13px 36px;
  font-size: 0.95rem;
  font-weight: 700;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  background: #fff;
  color: #0d0d0d;
  letter-spacing: 0.3px;
  transition: transform 0.13s, background 0.13s;
}

.btn:hover { transform: scale(1.04); background: #ddd; }

/* OVERLAY */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(6px);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.overlay.show { display: flex; }

.modal {
  background: #111;
  border: 1px solid #222;
  border-radius: 24px;
  padding: 40px 44px;
  text-align: center;
  max-width: 380px;
  width: 100%;
  animation: popIn 0.3s ease;
}

.modal-emoji { font-size: 4rem; margin-bottom: 10px; line-height: 1; }
.modal-title { font-size: 2rem; font-weight: 900; margin-bottom: 10px; letter-spacing: -0.5px; }
.modal-roast {
  font-size: 0.95rem;
  color: #888;
  line-height: 1.6;
  margin-bottom: 20px;
  font-style: italic;
}

.modal-divider {
  height: 1px;
  background: #1f1f1f;
  margin: 0 0 20px;
}

.modal-stats {
  display: flex;
  justify-content: center;
  gap: 28px;
  margin-bottom: 26px;
}

.mstat-label { font-size: 0.65rem; color: #444; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
.mstat-value { font-size: 1.3rem; font-weight: 800; }
</style>
</head>
<body>

<h1>💣 Tebak Bom</h1>
<p class="subtitle">pilih kotak — buah atau meledak?</p>

<div class="difficulty">
  <button class="diff-btn active" onclick="setDiff('mudah', this)">😊 Mudah</button>
  <button class="diff-btn" onclick="setDiff('normal', this)">😐 Normal</button>
  <button class="diff-btn" onclick="setDiff('hard', this)">💀 Hard</button>
</div>

<div class="scoreboard">
  <div class="score-cell">
    <div class="score-label">Total Skor</div>
    <div class="score-value gold" id="score">0</div>
  </div>
  <div class="score-cell">
    <div class="score-label">Win Streak</div>
    <div class="score-value green" id="streak">0</div>
  </div>
  <div class="score-cell">
    <div class="score-label">Menang</div>
    <div class="score-value white" id="wins">0</div>
  </div>
  <div class="score-cell">
    <div class="score-label">Kalah</div>
    <div class="score-value red" id="losses">0</div>
  </div>
  <div class="score-cell">
    <div class="score-label">💣 Bom</div>
    <div class="score-value white" id="bomb-count">1</div>
  </div>
  <div class="score-cell">
    <div class="score-label">🍎 Sisa</div>
    <div class="score-value white" id="fruit-left">11</div>
  </div>
  <div class="score-cell">
    <div class="score-label">Best Streak</div>
    <div class="score-value gold" id="best-streak">0</div>
  </div>
  <div class="score-cell">
    <div class="score-label">Ronde</div>
    <div class="score-value white" id="round">1</div>
  </div>
</div>

<div class="grid" id="grid"></div>

<button class="btn" onclick="startGame()">🔄 Main Lagi</button>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-emoji" id="modal-emoji"></div>
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-roast" id="modal-roast"></div>
    <div class="modal-divider"></div>
    <div class="modal-stats">
      <div>
        <div class="mstat-label">Skor</div>
        <div class="mstat-value" id="modal-score">0</div>
      </div>
      <div>
        <div class="mstat-label">Streak</div>
        <div class="mstat-value" id="modal-streak">0</div>
      </div>
      <div>
        <div class="mstat-label">Buah Dapat</div>
        <div class="mstat-value" id="modal-fruits">0</div>
      </div>
    </div>
    <button class="btn" onclick="closeModal(); startGame()">🎮 Main Lagi</button>
  </div>
</div>

<script>
const FRUITS = ['🍎','🍊','🍋','🍇','🍓','🍑','🍍','🥝','🍉','🫐','🥭','🍒'];
const TOTAL = 12;

const DIFF_BOMBS = { mudah: 1, normal: 1, hard: 2 };

const ROAST_LOSE = [
  "bro nyentuh bom kaya nyentuh mantan, ga bisa nahan diri 💀",
  "reflek lo lebih lambat dari sinyal 3G di daerah terpencil bro",
  "lu tadi milih pake feeling? feeling lu lagi error kayaknya",
  "bom segitu doang kena, tolong jangan jadi jihandak ya bro 😭",
  "kira-kira ada ga sih skill issue clinic buat kasus lu ini?"
];

const ROAST_WIN = [
  "oke oke, lucky boy nih. tapi coba yang susah dulu baru ngomong 😤",
  "menang sih, tapi muka lu waktu milih tadi pucet banget bro haha",
  "jangan ge-er dulu, bom-nya aja yang kasian ga kesentuh 💅",
  "wih selamat, tapi tetep aja muka lu pas nunggu reveal ngeri banget",
  "lu menang... kali ini. besok belum tentu, bro 😂"
];

let board = [], revealed = [];
let score = 0, streak = 0, bestStreak = 0;
let wins = 0, losses = 0, round = 1;
let gameOver = false, currentDiff = 'mudah';

function setDiff(d, btn) {
  currentDiff = d;
  document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  startGame();
}

function startGame() {
  gameOver = false;
  board = [];
  revealed = new Array(TOTAL).fill(false);

  const bombs = DIFF_BOMBS[currentDiff];
  const usedFruits = [];

  for (let i = 0; i < TOTAL; i++) {
    let f;
    do { f = FRUITS[Math.floor(Math.random() * FRUITS.length)]; } while (usedFruits.includes(f));
    usedFruits.push(f);
    board.push({ type: 'fruit', emoji: f });
  }

  const slots = [...Array(TOTAL).keys()];
  for (let i = 0; i < bombs; i++) {
    const ri = Math.floor(Math.random() * slots.length);
    board[slots[ri]].type = 'bomb';
    board[slots[ri]].emoji = '💣';
    slots.splice(ri, 1);
  }

  updateUI();
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (let i = 0; i < TOTAL; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.id = 'cell-' + i;
    cell.innerHTML = `<span class="cell-num">${i + 1}</span>`;
    cell.onclick = () => pick(i);
    grid.appendChild(cell);
  }
}

function pick(i) {
  if (gameOver || revealed[i]) return;
  revealed[i] = true;
  const cell = document.getElementById('cell-' + i);
  cell.innerHTML = `<span class="cell-num">${i + 1}</span>${board[i].emoji}`;

  if (board[i].type === 'bomb') {
    cell.classList.add('revealed', 'bomb');
    gameOver = true;
    // reset skor kalo kena bom
    score = 0;
    streak = 0;
    losses++;
    updateUI();
    setTimeout(() => {
      revealAll();
      setTimeout(() => showModal('lose'), 350);
    }, 300);
  } else {
    cell.classList.add('revealed', 'fruit');
    const mul = currentDiff === 'hard' ? 3 : currentDiff === 'normal' ? 2 : 1;
    score += 10 * mul;
    streak++;
    if (streak > bestStreak) bestStreak = streak;
    round++;
    updateUI();

    const fruitsLeft = board.filter((b, idx) => b.type === 'fruit' && !revealed[idx]).length;
    if (fruitsLeft === 0) {
      gameOver = true;
      wins++;
      setTimeout(() => showModal('win'), 350);
    }
  }
}

function revealAll() {
  for (let i = 0; i < TOTAL; i++) {
    if (!revealed[i]) {
      const cell = document.getElementById('cell-' + i);
      cell.innerHTML = `<span class="cell-num">${i + 1}</span>${board[i].emoji}`;
      cell.classList.add('revealed', 'dimmed');
      if (board[i].type === 'bomb') cell.classList.add('bomb');
      else cell.classList.add('fruit');
    }
  }
}

function updateUI() {
  document.getElementById('score').textContent = score;
  document.getElementById('streak').textContent = streak;
  document.getElementById('wins').textContent = wins;
  document.getElementById('losses').textContent = losses;
  document.getElementById('best-streak').textContent = bestStreak;
  document.getElementById('bomb-count').textContent = DIFF_BOMBS[currentDiff];
  document.getElementById('round').textContent = round;
  const fl = board.filter((b, idx) => b.type === 'fruit' && !revealed[idx]).length;
  document.getElementById('fruit-left').textContent = fl;
}

function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function showModal(type) {
  const found = board.filter((b, idx) => b.type === 'fruit' && revealed[idx]).length;

  if (type === 'win') {
    document.getElementById('modal-emoji').textContent = '🏆';
    document.getElementById('modal-title').textContent = 'MENANG!';
    document.getElementById('modal-roast').textContent = rand(ROAST_WIN);
  } else {
    document.getElementById('modal-emoji').textContent = '💥';
    document.getElementById('modal-title').textContent = 'BOOM!';
    document.getElementById('modal-roast').textContent = rand(ROAST_LOSE);
  }

  document.getElementById('modal-score').textContent = score;
  document.getElementById('modal-streak').textContent = streak;
  document.getElementById('modal-fruits').textContent = found;
  document.getElementById('overlay').classList.add('show');
}

function closeModal() {
  document.getElementById('overlay').classList.remove('show');
}

startGame();
</script>
</body>
</html>
